
server {
    listen 80;
    server_name ky.yf-mail.com;
    return 301 https://ky.yf-mail.com$request_uri;
}

server {
    listen 443 ssl;
    server_name ky.yf-mail.com;
    ssl_certificate /etc/nginx/certs/ky.yf-mail.com.crt;
    ssl_certificate_key /etc/nginx/certs/ky.yf-mail.com.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 256m;
    location / {
        proxy_pass http://shitou-academic-figures:18083;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }
}
